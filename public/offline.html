<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0B0B0B">
    <title>Beacon Hub - Offline</title>
    <style>
      :root { color-scheme: dark; font-family: Georgia, serif; background: #0b0b0b; color: #f9f6f0; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: radial-gradient(circle at top, #263238, #0b0b0b 62%); }
      main { width: min(90vw, 34rem); text-align: center; }
      img { width: 96px; height: 96px; border-radius: 24px; object-fit: cover; margin-bottom: 1.5rem; }
      h1 { margin: 0 0 .75rem; font-size: clamp(2rem, 8vw, 3.5rem); }
      p { margin: 0; color: #cbd5e1; font: 1rem/1.6 sans-serif; }
    </style>
  </head>
  <body>
    <main>
      <img src="/logo-192.png" alt="Beacon Hub logo">
      <h1>You are offline</h1>
      <p>Previously opened Beacon Hub pages remain available. Reconnect to load the latest signal.</p>
    </main>
  </body>
</html>
